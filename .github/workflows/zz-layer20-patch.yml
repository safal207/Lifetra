name: Layer 20 wiring

on:
  push:
    branches:
      - feat/trajectory-bead-graph

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trajectory-bead-graph
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Wire quorum fencing facade and changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("src/lib.rs")
          text = lib.read_text()
          if "mod quorum_fencing;" not in text:
              text = text.replace(
                  "mod provider_reconciliation;\n",
                  "mod provider_reconciliation;\nmod quorum_fencing;\n",
                  1,
              )
          export = (
              "pub use quorum_fencing::{\n"
              "    CoordinatorId, DatabaseNodeId, FenceGrant, FenceOutcome, FenceReceipt,\n"
              "    LeadershipGeneration, PromotionPermit, PromotionRequest, QuorumFencingAuthority,\n"
              "    QuorumFencingError, QuorumVote, QuorumVoteDecision,\n"
              "};\n"
          )
          if "pub use quorum_fencing::{" not in text:
              text = text.replace("pub use reconciliation::{\n", export + "pub use reconciliation::{\n", 1)
          lib.write_text(text)

          changelog = Path("CHANGELOG.md")
          ch = changelog.read_text()
          anchor = "- add `docs/postgres-split-brain-fencing.md`, `examples/postgres_split_brain_probe.rs`, and a dedicated `PostgreSQL Split-Brain CI` workflow for the resurrection/rejoin proof;\n"
          addition = (
              "- add provider-neutral `QuorumFencingAuthority` with unique coordinator membership, majority quorum, monotonic `LeadershipGeneration`, proposal locking, and stale-permit rejection;\n"
              "- split database failover authority into `FenceGrant`, externally observed `FenceReceipt`, and `PromotionPermit`, keeping quorum intent separate from proof that the old primary is actually fenced;\n"
              "- fail closed when quorum is lost, a coordinator votes twice, a non-member votes, the failed primary remains reachable, fencing is `Unknown`, or a competing candidate appears in the same generation;\n"
              "- add a dedicated PostgreSQL quorum-failover CI gate that refuses promotion without both quorum and confirmed old-primary fencing;\n"
              "- keep quorum leadership generation distinct from both PostgreSQL role and Lifetra per-action fencing epoch;\n"
              "- add `docs/quorum-fencing-authority.md` and `examples/quorum_fencing_gate.rs` for the external promotion-authority contract;\n"
          )
          if "QuorumFencingAuthority" not in ch:
              if anchor not in ch:
                  raise SystemExit("changelog split-brain anchor missing")
              ch = ch.replace(anchor, anchor + addition, 1)
          changelog.write_text(ch)
          PY

          cargo fmt --all
          rm .github/workflows/zz-layer20-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose quorum fencing authority"
          git push origin HEAD:feat/trajectory-bead-graph

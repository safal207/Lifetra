name: temporary layer16 finalize

on:
  push:
    branches:
      - feat/trajectory-bead-graph

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trajectory-bead-graph
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Export SQLSTATE classifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib.rs')
          text = p.read_text()
          old = '    classify_postgres_failure, PostgresCommitResolution, PostgresFailureDisposition,\n'
          new = '    classify_postgres_failure, classify_postgres_sqlstate, PostgresCommitResolution,\n    PostgresFailureDisposition,\n'
          if 'classify_postgres_sqlstate' not in text:
              if old not in text:
                  raise SystemExit('postgres resilience export block not found')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          cargo fmt --all
      - name: Commit facade export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git add src/lib.rs examples/postgres_failure_recovery.rs src/postgres_resilience.rs src/postgres_unified_store.rs
          git commit -m "feat: expose PostgreSQL failure recovery API"
          git push origin HEAD:feat/trajectory-bead-graph

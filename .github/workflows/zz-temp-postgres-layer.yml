name: temporary postgres layer patch

on:
  push:
    branches:
      - feat/trajectory-bead-graph

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trajectory-bead-graph
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire PostgreSQL facade and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib.rs')
          text = p.read_text()
          if 'mod postgres_unified_store;' not in text:
              text = text.replace('mod orientation_delta;\nmod provider_reconciliation;', 'mod orientation_delta;\nmod postgres_unified_store;\nmod provider_reconciliation;')
          export = '''pub use postgres_unified_store::{\n    PostgresUnifiedFencedRuntime, PostgresUnifiedFencedStore, PostgresUnifiedStoreError,\n};\n'''
          if 'pub use postgres_unified_store::' not in text:
              text = text.replace('pub use provider_reconciliation::{', export + 'pub use provider_reconciliation::{')
          p.write_text(text)
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs src/postgres_unified_store.rs
          git commit -m "feat: expose PostgreSQL unified fenced runtime"
          git push origin HEAD:feat/trajectory-bead-graph

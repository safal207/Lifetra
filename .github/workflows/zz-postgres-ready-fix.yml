name: PostgreSQL readiness hardening

on:
  push:
    branches:
      - feat/trajectory-bead-graph

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trajectory-bead-graph
          fetch-depth: 0

      - name: Require target database readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              ".github/workflows/rust.yml": (
                  "if docker exec lifetra-ha-primary pg_isready -U lifetra -d lifetra; then",
                  "if docker exec lifetra-ha-primary psql -U lifetra -d lifetra -Atc 'SELECT 1;' >/dev/null 2>&1; then",
              ),
              ".github/workflows/postgres-split-brain.yml": (
                  "if docker exec lifetra-sb-primary pg_isready -U lifetra -d lifetra; then",
                  "if docker exec lifetra-sb-primary psql -U lifetra -d lifetra -Atc 'SELECT 1;' >/dev/null 2>&1; then",
              ),
              ".github/workflows/postgres-quorum-failover.yml": (
                  "if docker exec lifetra-quorum-primary pg_isready -U lifetra -d lifetra; then",
                  "if docker exec lifetra-quorum-primary psql -U lifetra -d lifetra -Atc 'SELECT 1;' >/dev/null 2>&1; then",
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"readiness anchor missing in {filename}")
              path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/zz-postgres-ready-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: wait for target PostgreSQL database readiness"
          git push origin HEAD:feat/trajectory-bead-graph

name: temporary postgres clippy fix

on:
  push:
    branches:
      - feat/trajectory-bead-graph

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trajectory-bead-graph
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Clippy suggestion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/postgres_unified_store.rs')
          text = p.read_text()
          old = 'for pair in value.as_bytes().chunks_exact(2) {'
          new = 'for pair in value.as_bytes().as_chunks::<2>().0 {'
          if old not in text:
              raise SystemExit('chunks_exact pattern not found')
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/postgres_unified_store.rs
          git commit -m "fix: satisfy Clippy in PostgreSQL record codec"
          git push origin HEAD:feat/trajectory-bead-graph

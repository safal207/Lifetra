name: temporary layer16 commit tests

on:
  push:
    branches:
      - feat/trajectory-bead-graph

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trajectory-bead-graph
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add commit reconciliation tests
        env:
          TESTS_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          p = Path('src/postgres_unified_store.rs')
          text = p.read_text()
          text = text.replace(
              '(Some(expected), Some(record)) if record == *replacement => {',
              '(Some(_), Some(record)) if record == *replacement => {'
          )
          marker = '    #[test]\n    fn no_effect_proof_survives_postgres_round_trip_for_retry() {\n'
          if marker not in text:
              raise SystemExit('insertion marker not found')
          tests = base64.b64decode(os.environ['TESTS_B64']).decode()
          if 'lost_commit_ack_reconciles_exact_applied_replacement' not in text:
              text = text.replace(marker, tests + marker, 1)
          p.write_text(text)
          PY
          cargo fmt --all
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git add src/postgres_unified_store.rs
          git commit -m "test: cover PostgreSQL commit outcome reconciliation"
          git push origin HEAD:feat/trajectory-bead-graph
